<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Scorroday</title>
<link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="preload" href="/fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/app.css">
<script src="/theme.js"></script>
<script type="module" src="/app.js"></script>
</head>
<body>

<!-- Inloggen -->
<div class="login" id="login" hidden>
  <div class="login-card">
    <img src="/icons/logo.svg" alt="" width="112" height="112" class="login-logo">
    <h1>Scorroday</h1>
    <p class="login-sub">Je rooster, cijfers, huiswerk en berichten van SOMtoday. Maar dan fijn.</p>
    <button class="btn primary big" id="loginBtn" type="button">Inloggen met SOMtoday</button>
    <div class="error" id="loginError" role="alert" hidden></div>
    <button class="link-btn" id="demoBtn" type="button">Eerst even rondkijken (demo)</button>
    <p class="login-foot">Je logt in bij SOMtoday zelf, met je school­account. Je gegevens blijven op je telefoon; er zit geen server van Scorroday tussen.</p>
  </div>
</div>

<!-- De app -->
<div class="app" id="app" hidden>
  <header class="mast" id="mast">
    <div class="mast-l">
      <span class="mast-kicker" id="kicker"></span>
      <h1 class="mast-title" id="title">Vandaag</h1>
    </div>
    <div class="row">
      <span class="sync-dot" id="syncDot" role="status" title="Bijgewerkt"></span>
      <button class="icon-btn" id="msgBtn" type="button" aria-label="Berichten" data-icon="mail"><span class="badge" id="msgBadge" hidden></span></button>
      <button class="icon-btn" id="moreBtn" type="button" aria-label="Meer" data-icon="more"></button>
    </div>
  </header>

  <div class="view" id="view"></div>

  <nav class="nav" id="nav" aria-label="Navigatie">
    <div class="nav-pill" id="navPill">
      <span class="nav-ind" id="navInd" aria-hidden="true"></span>
      <button type="button" data-nav="vandaag"><span data-icon="home"></span><span>Vandaag</span></button>
      <button type="button" data-nav="rooster"><span data-icon="calendar"></span><span>Rooster</span></button>
      <button type="button" data-nav="cijfers"><span data-icon="chart"></span><span>Cijfers</span></button>
      <button type="button" data-nav="huiswerk"><span data-icon="book"></span><span>Huiswerk</span></button>
    </div>
    <button type="button" class="nav-add" id="navAdd" aria-label="Eigen taak toevoegen"><span data-icon="plus"></span></button>
  </nav>
</div>

<div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
